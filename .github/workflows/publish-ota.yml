name: Publish Latest OTA

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Android tools
        uses: android-actions/setup-android@v3

      - name: Install deterministic APK and binary diff tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;36.0.0' 'platform-tools'
          sudo apt-get update
          sudo apt-get install -y bsdiff
          test -x "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0/aapt"
          test -x "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0/apksigner"
          command -v bsdiff
          command -v bspatch

      - name: Read latest release and download APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > release.json
          TAG="$(jq -r '.tag_name' release.json)"
          APK_URL="$(jq -r '[.assets[] | select(.name | endswith(".apk"))][0].browser_download_url // empty' release.json)"
          APK_NAME="$(jq -r '[.assets[] | select(.name | endswith(".apk"))][0].name // empty' release.json)"
          if [ -z "$TAG" ] || [ -z "$APK_URL" ] || [ -z "$APK_NAME" ]; then
            echo "Latest release does not contain an APK asset" >&2
            exit 1
          fi
          gh release download "$TAG" --pattern '*.apk' --dir dist
          APK_PATH="dist/$APK_NAME"
          test -s "$APK_PATH" || { echo 'APK download failed' >&2; exit 1; }
          echo "Latest formal release: $TAG"
          echo "Target APK: $APK_PATH"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Verify APK identity and version
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0"
          AAPT="$BT/aapt"
          "$AAPT" dump badging "$APK_PATH" > /tmp/target-badging.txt
          BADGING="$(head -n 1 /tmp/target-badging.txt)"
          PACKAGE_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          EXPECTED_VERSION="${TAG#v}"
          EXPECTED_VERSION="${EXPECTED_VERSION#V}"
          echo "APK package=$PACKAGE_ID versionName=$VERSION_NAME versionCode=$VERSION_CODE tag=$TAG"
          test "$PACKAGE_ID" = 'com.wenhe.shanji' || { echo "Unexpected package id: $PACKAGE_ID" >&2; exit 1; }
          test "$VERSION_NAME" = "$EXPECTED_VERSION" || { echo "APK versionName mismatch" >&2; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "Invalid APK versionCode: $VERSION_CODE" >&2; exit 1; }
          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_SIZE_BYTES="$(stat -c '%s' "$APK_PATH")"
          echo "Target APK sha256=$SHA256 bytes=$APK_SIZE_BYTES"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "APK_SIZE_BYTES=$APK_SIZE_BYTES" >> "$GITHUB_ENV"

      - name: Generate verified patch from previous formal release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'PATCH_AVAILABLE=0' >> "$GITHUB_ENV"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          PREV_TAG="$(jq -r --arg tag "$TAG" '[.[] | select(.draft == false and .prerelease == false and .tag_name != $tag)] | sort_by(.published_at) | reverse | .[0].tag_name // empty' releases.json)"
          if [ -z "$PREV_TAG" ]; then
            echo 'No previous formal release; full APK only.'
            exit 0
          fi
          echo "Previous formal release selected: $PREV_TAG"

          mkdir -p previous
          gh release download "$PREV_TAG" --pattern '*.apk' --dir previous
          PREV_APK="$(find previous -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -s "$PREV_APK" || { echo "Previous release $PREV_TAG has no APK" >&2; exit 1; }

          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0"
          AAPT="$BT/aapt"
          APKSIGNER="$BT/apksigner"

          "$AAPT" dump badging "$PREV_APK" > /tmp/previous-badging.txt
          PREV_BADGING="$(head -n 1 /tmp/previous-badging.txt)"
          PREV_PACKAGE="$(printf '%s\n' "$PREV_BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          PREV_VERSION_CODE="$(printf '%s\n' "$PREV_BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          PREV_VERSION_NAME="$(printf '%s\n' "$PREV_BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          PREV_SHA256="$(sha256sum "$PREV_APK" | awk '{print $1}')"

          "$APKSIGNER" verify --verbose --print-certs "$PREV_APK" > /tmp/previous-cert.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" > /tmp/target-cert.txt
          PREV_SIGNER="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/previous-cert.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          TARGET_SIGNER="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/target-cert.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"

          echo "Previous APK package=$PREV_PACKAGE versionName=$PREV_VERSION_NAME versionCode=$PREV_VERSION_CODE sha256=$PREV_SHA256"
          echo "Previous signer=$PREV_SIGNER"
          echo "Target signer=$TARGET_SIGNER"
          test "$PREV_PACKAGE" = 'com.wenhe.shanji' || { echo 'Previous package mismatch' >&2; exit 1; }
          [[ "$PREV_VERSION_CODE" =~ ^[0-9]+$ ]] || { echo 'Previous versionCode invalid' >&2; exit 1; }
          test "$PREV_VERSION_CODE" -lt "$VERSION_CODE" || { echo 'Previous version is not older' >&2; exit 1; }
          test -n "$PREV_SIGNER" || { echo 'Previous signer digest missing' >&2; exit 1; }
          test "$PREV_SIGNER" = "$TARGET_SIGNER" || { echo 'Signing certificate continuity check failed' >&2; exit 1; }

          PATCH_NAME="from-${PREV_VERSION_CODE}-to-${VERSION_CODE}.bsdiff"
          PATCH_PATH="dist/$PATCH_NAME"
          echo "Generating $PATCH_NAME ..."
          bsdiff "$PREV_APK" "$APK_PATH" "$PATCH_PATH"
          echo 'Reconstructing target APK from patch ...'
          bspatch "$PREV_APK" /tmp/rebuilt.apk "$PATCH_PATH"
          cmp "$APK_PATH" /tmp/rebuilt.apk
          echo "$SHA256  /tmp/rebuilt.apk" | sha256sum -c -

          PATCH_SIZE_BYTES="$(stat -c '%s' "$PATCH_PATH")"
          PATCH_SHA256="$(sha256sum "$PATCH_PATH" | awk '{print $1}')"
          echo "Verified patch sha256=$PATCH_SHA256 bytes=$PATCH_SIZE_BYTES fullBytes=$APK_SIZE_BYTES"
          if [ "$PATCH_SIZE_BYTES" -ge "$APK_SIZE_BYTES" ]; then
            echo 'Patch is not smaller than full APK; publishing full APK only.'
            rm -f "$PATCH_PATH"
            exit 0
          fi

          echo "Uploading verified patch to formal release $TAG ..."
          gh release upload "$TAG" "$PATCH_PATH" --clobber
          PATCH_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${PATCH_NAME}"
          echo "PATCH_AVAILABLE=1" >> "$GITHUB_ENV"
          echo "PATCH_URL=$PATCH_URL" >> "$GITHUB_ENV"
          echo "PATCH_SHA256=$PATCH_SHA256" >> "$GITHUB_ENV"
          echo "PATCH_SIZE_BYTES=$PATCH_SIZE_BYTES" >> "$GITHUB_ENV"
          echo "PREV_VERSION_NAME=$PREV_VERSION_NAME" >> "$GITHUB_ENV"
          echo "PREV_VERSION_CODE=$PREV_VERSION_CODE" >> "$GITHUB_ENV"
          echo "PREV_SHA256=$PREV_SHA256" >> "$GITHUB_ENV"
          echo "Incremental patch verified and uploaded: $PREV_VERSION_NAME ($PREV_VERSION_CODE) -> $VERSION_NAME ($VERSION_CODE), $PATCH_SIZE_BYTES bytes"

      - name: Update version.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          release = json.loads(Path('release.json').read_text(encoding='utf-8'))
          body = (release.get('body') or '').strip()
          notes = []
          for raw in body.splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              if line.startswith('- '):
                  line = line[2:].strip()
              if line:
                  notes.append(line)
          if not notes:
              notes = [f"闪记 V{os.environ['VERSION_NAME']} 更新"]

          patches = []
          if os.environ.get('PATCH_AVAILABLE') == '1':
              patches.append({
                  'fromVersionName': os.environ['PREV_VERSION_NAME'],
                  'fromVersionCode': int(os.environ['PREV_VERSION_CODE']),
                  'fromSha256': os.environ['PREV_SHA256'],
                  'patchUrl': os.environ['PATCH_URL'],
                  'patchSha256': os.environ['PATCH_SHA256'],
                  'patchSizeBytes': int(os.environ['PATCH_SIZE_BYTES']),
              })

          data = {
              'schemaVersion': 2,
              'enabled': True,
              'versionName': os.environ['VERSION_NAME'],
              'versionCode': int(os.environ['VERSION_CODE']),
              'apkUrl': os.environ['APK_URL'],
              'sha256': os.environ['SHA256'],
              'forceUpdate': False,
              'releaseNotes': notes[:8],
              'apkSizeBytes': int(os.environ['APK_SIZE_BYTES']),
              'patches': patches,
          }
          Path('version.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cat version.json

      - name: Commit OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          if git diff --cached --quiet; then
            echo 'version.json already up to date'
            exit 0
          fi
          git commit -m "publish OTA ${TAG}"
          git push
